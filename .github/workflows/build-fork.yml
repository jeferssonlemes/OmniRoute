name: Build Fork Image (ghcr.io)

on:
  push:
    branches: [chatlabel/patches]
  workflow_dispatch:

# Least-privilege default: read-only at the top level; the build job that pushes to
# GHCR grants packages: write itself (Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  build:
    name: Build and Push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (publish only on patches updates)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          # Manual dispatch validates the exact Docker build without publishing.
          # A push to chatlabel/patches retains the existing release behavior.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=8192
            OMNIROUTE_BUILD_WORKERS=2
            OMNIROUTE_USE_TURBOPACK=0
          tags: |
            ghcr.io/${{ github.repository_owner }}/omniroute:patches-latest
            ghcr.io/${{ github.repository_owner }}/omniroute:patches-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
